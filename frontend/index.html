<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentDojo 数据流追踪可视化平台</title>
    <!-- D3.js v7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="navbar-brand">
            <span class="logo">🛡️</span>
            <h1>AgentDojo 数据流追踪可视化平台</h1>
        </div>
        <nav class="navbar-tabs">
            <button class="tab active" data-tab="monitor">📡 实时监控</button>
            <button class="tab" data-tab="history">📜 历史回放</button>
            <button class="tab" data-tab="audit">🔍 风险审计</button>
        </nav>
        <div class="navbar-status">
            <span class="status-dot live"></span>
            <span id="statusText">实时</span>
        </div>
    </header>

    <div class="main-container">
        <!-- 左侧：拓扑图主区域 -->
        <div class="graph-panel">
            <div class="panel-header">
                <h2>🌐 数据流拓扑图</h2>
                <div class="graph-controls">
                    <button id="btnReset" title="重置视图">🔄 重置</button>
                    <button id="btnAutoLayout" title="自动布局">⚡ 自动布局</button>
                    <label>
                        <input type="checkbox" id="chkShowLabels" checked> 显示标签
                    </label>
                </div>
            </div>
            <div id="graph-container">
                <svg id="graph-svg"></svg>
                <!-- 图例 -->
                <div class="legend">
                    <div class="legend-item"><span class="legend-color" style="background:#4A90D9"></span> AIAgent</div>
                    <div class="legend-item"><span class="legend-color" style="background:#2ECC71"></span> AIModelInvocation</div>
                    <div class="legend-item"><span class="legend-color" style="background:#E67E22"></span> AgentTool</div>
                    <div class="legend-item"><span class="legend-color" style="background:#F1C40F"></span> Prompt</div>
                    <div class="legend-item"><span class="legend-color" style="background:#9B59B6"></span> DomainData</div>
                    <div class="legend-item"><span class="legend-color" style="background:#E74C3C; animation: pulse 1.5s infinite;"></span> 异常节点</div>
                </div>

                <!-- 节点详情浮动面板 -->
                <div id="nodeDetailPanel" class="float-panel" style="display:none;">
                    <div class="float-panel-header" id="nodeDetailDragHandle">
                        <span class="float-panel-title">🔍 节点详情</span>
                        <div class="float-panel-actions">
                            <button class="float-panel-btn" id="btnMinimizeNodeDetail" title="最小化">─</button>
                            <button class="float-panel-btn" id="btnCloseNodeDetail" title="关闭">✕</button>
                        </div>
                    </div>
                    <div class="float-panel-body" id="nodeDetailBody">
                        <p class="hint">点击拓扑图中的节点查看详情</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：信息面板 -->
        <div class="side-panel">
            <!-- 操作控制台 -->
            <div class="card console-card" id="agentConsole">
                <h3>🎮 操作控制台</h3>
                <div class="console-section">
                    <div class="console-label">预设任务</div>
                    <div class="scenario-buttons" id="scenarioButtons">
                        <p class="hint">加载中...</p>
                    </div>
                </div>
                <div class="console-section">
                    <div class="console-label">自定义指令</div>
                    <div class="custom-input-group">
                        <input type="text" id="inputCustomAction" 
                               placeholder="输入指令，如：读取邮件、查询余额..." 
                               class="custom-input">
                        <button id="btnCustomAction" class="btn-execute" title="执行指令">▶ 执行</button>
                    </div>
                </div>
                <div class="console-section attack-section">
                    <div class="console-label attack-section-header">
                        🔴 攻击场景（注入测试）
                        <span class="attack-hint">关闭防御后执行可观察注入效果</span>
                    </div>
                    <div class="attack-scenario-buttons" id="attackScenarioButtons">
                        <p class="hint">加载中...</p>
                    </div>
                </div>
                <div class="console-feedback" id="consoleFeedback" style="display:none;"></div>
            </div>

            <!-- 统计面板 -->
            <div class="card stats-card">
                <h3>📊 统计概览</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="statNodes">0</span>
                        <span class="stat-label">总节点</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statEdges">0</span>
                        <span class="stat-label">总边数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statEvents">0</span>
                        <span class="stat-label">事件数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statBlocks">0</span>
                        <span class="stat-label">风险卡片</span>
                    </div>
                </div>
            </div>

            <!-- 风险卡片面板 -->
            <div class="card risk-card-panel">
                <h3>🚨 风险卡片</h3>
                <div id="riskCards">
                    <p class="hint">暂无风险事件</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部：事件时间线 -->
    <div class="timeline-panel">
        <div class="panel-header">
            <h3>📋 事件时间线</h3>
            <div class="timeline-controls">
                <button id="btnClearTimeline">🗑️ 清空</button>
            </div>
        </div>
        <div class="timeline-container" id="timelineEvents">
            <div class="timeline-empty">等待事件数据...</div>
        </div>
    </div>

    <!-- 节点详情弹窗 -->
    <div id="nodeModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/risk-panel.js"></script>
    <script src="js/status-panel.js"></script>
    <script src="js/trace-panel.js"></script>
    <script src="js/console.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
